name: CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_BACKEND_REPOSITORY: laptop-rental-backend
  ECR_FRONTEND_REPOSITORY: laptop-rental-frontend

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        working-directory: backend
        run: npm ci

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_RAZORPAY_KEY: ${{ secrets.VITE_RAZORPAY_KEY }}
        run: npm run build

      # -------------------------
      # Docker build
      # -------------------------

      - name: Build backend Docker image
        run: |
          docker build \
            -t laptop-rental-backend:ci \
            ./backend

      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_RAZORPAY_KEY=${{ secrets.VITE_RAZORPAY_KEY }} \
            -t laptop-rental-frontend:ci \
            ./frontend

      # -------------------------
      # Security scan
      # -------------------------

      - name: Scan backend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: laptop-rental-backend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      - name: Scan frontend image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: laptop-rental-frontend:ci
          format: table
          exit-code: 1
          ignore-unfixed: true
          severity: CRITICAL,HIGH

      # -------------------------
      # AWS authentication
      # -------------------------

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # -------------------------
      # ECR login
      # -------------------------

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # -------------------------
      # Tag images
      # -------------------------

      - name: Tag Docker images
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag \
            laptop-rental-backend:ci \
            $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG

          docker tag \
            laptop-rental-backend:ci \
            $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

          docker tag \
            laptop-rental-frontend:ci \
            $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG

          docker tag \
            laptop-rental-frontend:ci \
            $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest

      # -------------------------
      # Push to ECR
      # -------------------------

      - name: Push backend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_BACKEND_REPOSITORY:latest

      - name: Push frontend image to ECR
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push \
            $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:$IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_FRONTEND_REPOSITORY:latest
        