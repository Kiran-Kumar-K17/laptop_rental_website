services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    env_file:
      - ./backend/.env  
    ports:
      - "5000:5000"
    restart: unless-stopped
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_RAZORPAY_KEY: ${VITE_RAZORPAY_KEY}
    container_name: frontend
    ports:
      - "3000:80"

    depends_on:
      - backend

    restart: unless-stopped