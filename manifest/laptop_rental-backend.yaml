#-----Backend-----#
apiVersion: apps/v1
kind: Deployment
metadata:
  name: laptop-rental-deployment-backend
spec:
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
    spec:
      containers:
        - name: laptop-rental-backend
          image: kirankumark17/laptop-rental:backend
          envFrom:
            - secretRef:
                name: env-secret
          ports:
            - containerPort: 8000
---
apiVersion: v1
kind: Service
metadata:
  name: backend-service
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - protocol: TCP
      port: 8000
      targetPort: 8000
